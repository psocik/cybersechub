baseurl: "https://hub.ictsec.pl"
languageCode: "en-us"
title: "Cyber Security Hub"
theme: "github-style"
pygmentsCodeFences: true
pygmentsUseClasses: true
enableEmoji: true

# RSS Feed Configuration
outputs:
  home:
    - HTML
    - RSS
  section:
    - HTML
    - RSS

taxonomies:
  tag: tags
  series: series

params:
  description: "Cyber Security HUB"
  copyright: "CSH"
  author: "psociksec"
  opengraph: true
  lastmod: true
  #favicon: "/img/github-mark.png"
  #avatar: "/img/img.png"
  #headerIcon: "/img/github-mark-white.png"
  location: "Poland"
  userStatusEmoji: "🛡️" #flere her: 😪 sleepy face , 😁 beeming , 💤 sleepy , 🛡️ shield
  mermaid: true
  custom_css:
  - "/css/custom-width.css"
  # RSS Feed Configuration
  rssLimit: 20  # Number of items in RSS feed
  # Social links
  social:
    github: "psocik"
    linkedin: "psocik"
  #services
services:
  googleAnalytics:
    ID: "G-TKFC71T8WB"

# Ensure private research repo is never published
ignoreFiles:
- "^research/"
- "/_notes/"
